# Cấu hình của hệ thống – Đặc tả 3.2, mục 11 và mục 20.
# Tệp nằm trong kho mã nên mọi lần sửa đều có lịch sử. Màn hình Cấu hình làm sau.
#
# Phần 1 – ngưỡng do văn phòng tự đặt (mục 20). Giá trị ban đầu chốt ngày 20/10/2026,
# bổ sung ngày 21/10/2026; xem lại sau 4 tuần chạy thật.
#
# Phần 2 – con số lấy từ luật (mục 11), ở cuối tệp. Mỗi con số kèm căn cứ, số văn bản hợp nhất
# và ngày đối chiếu; luật đổi thì thêm giá trị mới kèm ngày áp dụng, giữ giá trị cũ.
#
# Bản mẫu giao diện chưa đọc tệp này; Lát 1 sẽ đọc khi khởi động.

chu_de_tin_tuc:
  het_han_sau_ngay_khong_nhac: 14

luot_xem_tang_nhanh:
  ty_le_tang_toi_thieu: 0.20        # từ 20% trở lên
  khoang_cach_quet_toi_thieu_gio: 24
  luot_xem_toi_thieu: 500

gop_cau_hoi:
  tu_gop_tu: 0.85                   # độ giống >= 0,85: tự gộp
  hoi_ai_tu: 0.65                   # 0,65 <= độ giống < 0,85: hỏi AI; dưới 0,65: tách riêng

tran_truy_cap_moi_ngay:
  tang_1_moi_nguon: 300             # yêu cầu
  bao_chi: 100
  doi_thu_trang: 80

lich_quet_tang_1:
  gio_bat_dau: "06:00"
  gio_ket_thuc: "22:00"
  chu_ky_phut: 60
  nguon_uu_tien: [cong_bao, vbpl]   # mỗi 30 phút trong giờ hành chính
  chu_ky_uu_tien_phut: 30

nguon_loi:
  bao_sau_so_luot_loi_lien_tiep: 2
  chuyen_dan_link_tay_sau_gio: 24

nguon_im_lang:
  boi_so_khoang_cach_thuong_le: 3

do_phu:
  canh_bao_duoi: 0.80

the_goi_y:
  so_the_moi_ngay: [5, 7]
  ty_le_luong:
    chuyen_mon: 0.667               # 2/3
    dai_chung: 0.333                # 1/3
  chong_lap_ngay:
    sau_khi_bo: 7
    chua_ai_xu_ly: 3

can_xem:
  nhac_trong_ban_tin_sau_gio: 48
  viec_lien_quan_khan_nhac_telegram_sau_gio: 4

tin_khan_chua_xem:
  nhac_mot_lan_sau_gio: 4
  gio_yen_lang: ["22:00", "07:00"]  # rơi vào khoảng này thì nhắc lúc 07:00

han_muc_ai_usd_moi_ngay:
  thuong: 3.00
  ky_hop_quoc_hoi: 5.00
  canh_bao_o: 0.70

phien_dang_nhap:
  het_han_khi_khong_thao_tac_gio: 2
  toi_da_gio: 12

ban_tin:
  gio_gui: "06:30"                  # Telegram tóm tắt và Gmail bản đầy đủ

# ---------------------------------------------------------------------------
# Phần 2 – con số lấy từ luật (mục 11)
# Chưa điền giá trị: đối chiếu từng điều với văn bản hợp nhất trên nguồn chính thống trong GĐ0,
# chốt sau khi Kỳ họp thứ 2 bế mạc (dự kiến 21/11/2026, dự phòng 23/11/2026).
# Căn cứ chung: Luật 64/2025/QH15, được sửa đổi, bổ sung bởi Luật 87/2025/QH15.

moc_nhac_hieu_luc_ngay: [30, 7, 0]  # T-30, T-7, T-0 (mục 11)

quy_tac_luat:
  hieu_luc:
    can_cu: "Luật 64/2025/QH15, Điều 53 khoản 1"
    gia_tri: []                     # mỗi phần tử: {gia_tri, ap_dung_tu, van_ban_hop_nhat, ngay_doi_chieu}
  tam_ngung_hieu_luc:
    can_cu: "Luật 64/2025/QH15, Điều 56 khoản 3"
    gia_tri: []
  chua_co_van_ban_goc:
    can_cu: "Luật 64/2025/QH15, Điều 9 (khoản 3 sửa bởi Luật 87/2025/QH15)"
    gia_tri: []

bo_loc_loai_van_ban:
  can_cu: "Luật 64/2025/QH15, Điều 4 (sửa bởi Luật 87/2025/QH15)"
  loai_quy_pham: []                 # điền trong GĐ0 theo văn bản hợp nhất
  ngoai_le_luon_qua_bo_loc:         # không phải văn bản quy phạm nhưng luôn xử lý (mục 5)
    - dinh_chinh_van_ban_quy_pham
    - dinh_chi_tam_ngung_ngung_hieu_luc_van_ban_quy_pham
