# Ngưỡng do văn phòng tự đặt – Đặc tả 3.2, mục 20.
# Giá trị ban đầu chốt ngày 20/10/2026, bổ sung ngày 21/10/2026; xem lại sau 4 tuần chạy thật.
# Chỉnh trực tiếp tệp này; màn hình Cấu hình làm sau.
#
